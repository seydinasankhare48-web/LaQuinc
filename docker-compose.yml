# Le PostgreSQL de développement vient de la CLI Supabase (`supabase start`).
# `postgres-test` ne sert qu'aux tests (faux schéma `auth`, voir packages/db).
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laquinc_test
    ports: ["54330:5432"]
    tmpfs: [/var/lib/postgresql/data]
